[workspace]
members = [
    "crates/lipl-display-common",
    "crates/lipl-display-egui",
    "crates/lipl-display-freya",
    "crates/lipl-display-gpui",
    "crates/lipl-display-xilem",
    "crates/lipl-gatt-bluer",
    "crates/lipl-gatt-bluer-cli",
    "crates/lipl-gatt-zbus",
    "crates/login-poweroff-reboot", "crates/login-poweroff-reboot-zbus",
]
resolver = "3"

[workspace.package]
authors = ["Paul Min"]
edition = "2024"
homepage = "https://www.paulmin.nl/lipl.html"
license = "MIT"
repository = "https://github.com/paulusminus/lipl-display/"
version = "0.4.8"

[workspace.metadata.cargo-udeps.ignore]
normal = ["dioxus-native"]
development = ["dioxus-native"]
build = ["dioxus-native"]

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1

[workspace.dependencies]
anyhow = "1.0.102"
async-channel = "2.5.0"
bluer = { version = "0.17.4", features = ["bluetoothd"]}
dbus = "0.9.11"
derive_builder = "0.20.2"
eframe = { version = "0.36.0", default-features = false, features = [
  "glow",
  "wayland",
]}
env_logger = "0.11.10"
freya = { version = "0.5.0-rc.9", features = ["radio", "sdk-tokio"] }
futures = "0.3.32"
futures-util = "0.3.32"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2", default-features = false, features = [
    "wayland",
    "font-kit",
] }
gpui_linux = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2", default-features = false, features = ["wayland"] }
gpui_tokio = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2", default-features = false }
deserialize-lines = { git = "https://github.com/paulusminus/json-lines" }
lipl-display-common = { version = "0.4.6", path = "crates/lipl-display-common" }
lipl-gatt-bluer = { version = "0.4.6", path = "crates/lipl-gatt-bluer" }
log = "0.4.29"
login-poweroff-reboot = { version = "0.4.6", path = "crates/login-poweroff-reboot" }
pin-project = "1.1.12"
serde = "1.0.228"
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = "1.52.3"
tokio-stream = "0.1.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.23.1"
xilem = "0.4.0"
zbus = { version = "5.15.0", default-features = false }
